<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183c2b">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <title>Fieldnote — Poultry farm manager</title>
  <style>
    :root {
      --forest: #183c2b;
      --forest-2: #244c38;
      --leaf: #5e8c60;
      --lime: #d7ed9f;
      --paper: #f7f8f3;
      --white: #fff;
      --ink: #1c2a21;
      --muted: #78827a;
      --line: #e8ebe4;
      --orange: #d58b3a;
      --red: #bd5b4e;
      --shadow: 0 12px 40px rgba(28, 42, 33, .07);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      font-synthesis: none;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--paper); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 252px; flex: 0 0 252px; background: var(--forest); color: #fff;
      padding: 27px 16px 18px; display: flex; flex-direction: column; min-height: 100vh;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 12px 30px; }
    .brand-mark { width: 37px; height: 37px; background: var(--lime); color: var(--forest); border-radius: 12px; display: grid; place-items: center; }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-name { font-size: 19px; line-height: 1.1; font-weight: 720; letter-spacing: -.5px; }
    .brand-caption { color: #b6c8b9; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; margin-top: 5px; }
    .nav-label { color: #92aa97; font-size: 10px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; padding: 9px 13px 10px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { width: 100%; color: #d4dfd5; border: 0; text-align: left; background: transparent; padding: 11px 13px; border-radius: 9px; display: flex; align-items: center; gap: 12px; font-size: 13px; transition: background .15s, color .15s; }
    .nav-item[hidden] { display: none; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: white; }
    .nav-item.active { background: #315a40; color: white; box-shadow: inset 3px 0 var(--lime); }
    .nav-icon { display: grid; place-items: center; width: 18px; opacity: .9; font-size: 16px; }
    .nav-count { margin-left: auto; color: #d8edaa; font-size: 11px; }
    .side-bottom { margin-top: auto; }
    .farm-card { margin: 20px 4px 14px; padding: 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.055); }
    .farm-overline { color: #a9bdad; text-transform: uppercase; letter-spacing: 1px; font-size: 9px; }
    .farm-name { font-weight: 650; margin-top: 6px; font-size: 13px; }
    .farm-location { color: #adbdaf; font-size: 11px; margin-top: 4px; }
    .profile { border-top: 1px solid rgba(255,255,255,.12); padding: 17px 7px 0; display: flex; gap: 10px; align-items: center; }
    .avatar { width: 33px; height: 33px; border-radius: 50%; display: grid; place-items: center; background: #d8e6be; color: var(--forest); font-weight: 750; font-size: 12px; }
    .profile-name { font-size: 12px; font-weight: 650; }
    .profile-role { color: #a9bdad; font-size: 10px; margin-top: 3px; }
    .main { flex: 1; min-width: 0; }
    .topbar { height: 76px; background: rgba(255,255,255,.82); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; padding: 0 38px; position: sticky; top: 0; z-index: 3; backdrop-filter: blur(12px); }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--ink); font-weight: 650; }
    .top-actions { display: flex; align-items: center; gap: 17px; }
    .sync-status { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .date-pill { display: flex; align-items: center; gap: 8px; color: #657168; font-size: 12px; }
    .icon-button { border: 1px solid var(--line); border-radius: 9px; width: 37px; height: 37px; background: #fff; color: var(--forest); display: grid; place-items: center; position: relative; }
    .icon-button .dot { position: absolute; width: 7px; height: 7px; top: 7px; right: 7px; background: var(--orange); border-radius: 50%; border: 1px solid #fff; }
    .mobile-brand { display: none; }
    .content { max-width: 1480px; padding: 32px 38px 50px; margin: auto; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 25px; }
    .eyebrow { color: var(--leaf); font-size: 10px; letter-spacing: 1.4px; text-transform: uppercase; font-weight: 750; margin-bottom: 8px; }
    h1 { margin: 0; font-size: clamp(24px, 3vw, 31px); letter-spacing: -1.1px; line-height: 1.14; }
    .subtitle { color: var(--muted); margin: 8px 0 0; font-size: 13px; }
    .button { border: 0; border-radius: 8px; background: var(--forest); color: white; padding: 11px 15px; font-size: 12px; font-weight: 650; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 3px 8px rgba(24,60,43,.12); transition: transform .12s, background .12s; white-space: nowrap; }
    .button:hover { background: var(--forest-2); transform: translateY(-1px); }
    .button.secondary { color: var(--forest); background: white; border: 1px solid var(--line); box-shadow: none; }
    .button.secondary:hover { background: #f8faf5; }
    .button.small { padding: 8px 11px; font-size: 11px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 14px; margin-bottom: 17px; }
    .metric { background: white; border: 1px solid var(--line); border-radius: 12px; padding: 17px 18px; min-height: 125px; }
    .metric-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 11px; }
    .metric-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: #edf4e7; color: var(--forest); }
    .metric-value { font-size: 26px; letter-spacing: -1px; font-weight: 730; margin-top: 13px; }
    .metric-foot { font-size: 10px; color: var(--muted); margin-top: 5px; }
    .positive { color: #548454; font-weight: 650; }
    .negative { color: var(--red); font-weight: 650; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, .95fr); gap: 16px; margin-bottom: 16px; }
    .panel { background: white; border: 1px solid var(--line); border-radius: 12px; min-width: 0; }
    .panel-head { padding: 18px 20px 13px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .panel-title { font-size: 13px; font-weight: 700; }
    .panel-note { color: var(--muted); font-size: 10px; margin-top: 5px; }
    .select-mini { border: 1px solid var(--line); border-radius: 6px; color: #657168; background: white; padding: 6px 8px; font-size: 10px; }
    .chart-wrap { padding: 0 17px 13px; }
    .chart { width: 100%; height: 180px; display: block; overflow: visible; }
    .chart-label { fill: #88938a; font-size: 9px; font-family: inherit; }
    .chart-grid { stroke: #edf0ea; stroke-width: 1; }
    .chart-area { fill: url(#chartFill); }
    .chart-line { fill: none; stroke: #527d50; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .chart-dot { fill: white; stroke: #527d50; stroke-width: 2; }
    .chart-footer { display: flex; align-items: center; gap: 8px; padding: 3px 6px; color: var(--muted); font-size: 10px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; background: #648c59; }
    .health-summary { padding: 0 20px 15px; }
    .health-total { border-radius: 10px; background: #f3f6ed; display: flex; padding: 15px; align-items: center; justify-content: space-between; margin-bottom: 13px; }
    .health-total strong { font-size: 22px; letter-spacing: -.5px; }
    .health-total span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .health-total .big-icon { font-size: 24px; }
    .flock-mini { padding: 11px 0; border-bottom: 1px solid #eff1ed; }
    .flock-mini:last-child { border-bottom: 0; }
    .flock-row { display: flex; justify-content: space-between; align-items: center; }
    .flock-mini-name { font-size: 11px; font-weight: 650; }
    .flock-mini-meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .flock-mini-rate { font-size: 11px; font-weight: 700; color: var(--forest); }
    .progress { height: 4px; border-radius: 8px; background: #eef0ea; margin-top: 9px; overflow: hidden; }
    .progress span { display: block; height: 100%; background: #7ea06c; border-radius: inherit; }
    .bottom-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(270px, .8fr); gap: 16px; }
    .table-wrap { overflow: auto; }
    table { border-collapse: collapse; width: 100%; text-align: left; }
    th { font-size: 9px; text-transform: uppercase; letter-spacing: .8px; color: #929b92; font-weight: 700; padding: 10px 19px; border-top: 1px solid #f1f2ef; white-space: nowrap; }
    td { padding: 12px 19px; border-top: 1px solid #f1f2ef; font-size: 11px; white-space: nowrap; }
    tbody tr:hover { background: #fbfcf9; }
    .strong-cell { font-weight: 650; color: #2a382e; }
    .muted-cell { color: var(--muted); }
    .badge { display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; padding: 5px 8px; font-size: 9px; font-weight: 650; }
    .badge.good { color: #4a784c; background: #edf5e9; }
    .badge.warn { color: #9c6a2a; background: #fbf2df; }
    .badge.alert { color: #a44f43; background: #faece9; }
    .badge.neutral { color: #657168; background: #f0f2ed; }
    .dot-status { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .stock-list { padding: 0 20px 13px; }
    .stock-row { padding: 12px 0; display: flex; align-items: center; gap: 11px; border-top: 1px solid #f1f2ef; }
    .stock-icon { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: #f3f5ef; font-size: 15px; }
    .stock-info { flex: 1; min-width: 0; }
    .stock-name { font-size: 11px; font-weight: 650; }
    .stock-unit { font-size: 9px; margin-top: 4px; color: var(--muted); }
    .stock-level { text-align: right; font-size: 11px; font-weight: 700; }
    .stock-level small { display: block; font-size: 9px; color: var(--muted); font-weight: 400; margin-top: 3px; }
    .alert-banner { display: flex; gap: 11px; padding: 12px 13px; background: #fbf5e8; border: 1px solid #f1e7ce; border-radius: 9px; margin: 0 20px 17px; }
    .alert-banner .alert-icon { font-size: 15px; }
    .alert-banner strong { display: block; font-size: 10px; }
    .alert-banner p { font-size: 9px; margin: 4px 0 0; color: #7f7561; line-height: 1.5; }
    .toolbar { display: flex; align-items: center; gap: 9px; }
    .search { border: 1px solid var(--line); background: white; padding: 9px 11px; border-radius: 8px; width: 205px; font-size: 11px; outline: none; }
    .search:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: #7e9e71; box-shadow: 0 0 0 3px rgba(126,158,113,.12); }
    .list-panel { overflow: hidden; }
    .list-summary { display: flex; gap: 10px; padding: 0 20px 16px; flex-wrap: wrap; }
    .summary-chip { font-size: 10px; color: #6d786f; background: #f5f7f2; border-radius: 6px; padding: 7px 9px; }
    .summary-chip strong { color: var(--forest); margin-right: 4px; }
    .empty-state { text-align: center; color: var(--muted); padding: 36px 20px; font-size: 12px; }
    .report-grid { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 14px; margin-bottom: 16px; }
    .report-card { padding: 18px; background: white; border: 1px solid var(--line); border-radius: 12px; }
    .report-card .label { font-size: 10px; color: var(--muted); }
    .report-card .value { font-size: 24px; letter-spacing: -.7px; font-weight: 720; margin-top: 9px; }
    .report-card .hint { font-size: 10px; color: var(--muted); margin-top: 5px; }
    .report-columns { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .report-row { display: flex; justify-content: space-between; border-top: 1px solid #f0f2ee; padding: 12px 0; font-size: 11px; }
    .report-row strong { font-weight: 650; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(16, 29, 21, .45); z-index: 10; display: grid; place-items: center; padding: 18px; }
    .modal { width: min(100%, 510px); max-height: min(90vh, 760px); overflow: auto; background: #fff; border-radius: 14px; box-shadow: 0 25px 80px rgba(0,0,0,.2); }
    .modal-head { padding: 21px 23px 15px; display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1px solid var(--line); }
    .modal-head h2 { font-size: 18px; margin: 0; letter-spacing: -.4px; }
    .modal-head p { color: var(--muted); font-size: 11px; margin: 6px 0 0; }
    .close-button { border: 0; background: transparent; color: var(--muted); font-size: 22px; padding: 0 3px; line-height: 1; }
    .modal-form { padding: 19px 23px 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #69756b; font-size: 10px; font-weight: 650; }
    .field input, .field select, .field textarea { border: 1px solid #e3e8e0; border-radius: 7px; padding: 10px; color: var(--ink); background: white; outline: none; font-size: 11px; width: 100%; }
    .field textarea { resize: vertical; min-height: 68px; }
    .form-error { color: var(--red); font-size: 10px; margin-top: 10px; min-height: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 17px; }
    .toast { position: fixed; right: 24px; bottom: 24px; z-index: 15; background: var(--forest); color: white; padding: 12px 16px; border-radius: 9px; font-size: 12px; box-shadow: var(--shadow); animation: appear .2s ease-out; }
    .auth-screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: radial-gradient(ellipse at 15% 15%, #e8efdd 0, transparent 38%), var(--paper); padding: 18px; overflow: auto; }
    .auth-card { width: min(100%, 440px); background: white; border: 1px solid var(--line); border-radius: 16px; padding: 30px; box-shadow: 0 18px 55px rgba(28,42,33,.1); }
    .auth-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 23px; }
    .auth-kicker { color: var(--leaf); font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 750; margin-bottom: 8px; }
    .auth-card h2 { margin: 0; font-size: 25px; letter-spacing: -.7px; }
    .auth-card > p { font-size: 12px; line-height: 1.7; color: var(--muted); margin: 8px 0 23px; }
    .auth-form { display: grid; gap: 15px; }
    .auth-form .field label { font-size: 11px; }
    .auth-form .field input { padding: 12px; font-size: 13px; }
    .auth-form > .button { width: 100%; justify-content: center; margin-top: 2px; padding: 12px; }
    .auth-error { min-height: 0; color: var(--red); font-size: 11px; line-height: 1.5; }
    .auth-error:not(:empty) { padding: 9px 10px; border-radius: 7px; background: #faece9; }
    @keyframes appear { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .menu-button { display: none; }
    @media (max-width: 1050px) {
      .sidebar { width: 220px; flex-basis: 220px; }
      .content { padding-left: 25px; padding-right: 25px; }
      .topbar { padding: 0 25px; }
      .metrics { grid-template-columns: repeat(2,1fr); }
      .dashboard-grid, .bottom-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .sidebar { position: fixed; z-index: 8; left: -260px; top: 0; bottom: 0; width: 250px; transition: left .2s; box-shadow: 10px 0 30px rgba(0,0,0,.14); }
      .sidebar.open { left: 0; }
      .topbar { height: 62px; padding: 0 15px; }
      .menu-button { display: grid; margin-right: 10px; }
      .top-left { display: flex; align-items: center; }
      .mobile-brand { display: block; color: var(--forest); font-weight: 750; font-size: 16px; letter-spacing: -.4px; }
      .breadcrumb { display: none; }
      .date-pill { display: none; }
      .top-actions { gap: 9px; }
      .sync-status { display: none; }
      .content { padding: 25px 15px 35px; }
      .page-heading { align-items: flex-start; flex-direction: column; }
      .page-heading .toolbar { width: 100%; }
      .toolbar .search { flex: 1; width: auto; min-width: 0; }
      .metrics { gap: 9px; }
      .metric { min-height: 111px; padding: 13px; }
      .metric-value { font-size: 22px; }
      .metric-top { font-size: 10px; }
      .report-grid { grid-template-columns: 1fr 1fr; gap: 9px; }
      .report-card:last-child:nth-child(odd) { grid-column: 1 / -1; }
      .report-columns { grid-template-columns: 1fr; }
      .chart { height: 155px; }
      .table-wrap { margin: 0 -2px; }
      th, td { padding-left: 13px; padding-right: 13px; }
      .list-summary { padding-left: 14px; padding-right: 14px; }
      .panel-head { padding-left: 15px; padding-right: 15px; }
    }
    @media (max-width: 410px) {
      .button { padding: 10px 11px; font-size: 11px; }
      .metric-icon { width: 27px; height: 27px; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20c0-5.2 1.9-9.2 7-12"/><path d="M5 9c4.8 0 7 2.5 7 7"/><path d="M4 5c3.5-.2 6.2 1.2 8 4"/><path d="M12 20c-4.3 0-7-2.1-7-6"/></svg>
        </div>
        <div><div class="brand-name">Fieldnote</div><div class="brand-caption">Farm, in good order</div></div>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="nav-list" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-page="flocks"><span class="nav-icon">♧</span>Flocks <span class="nav-count" id="flock-count">0</span></button>
        <button class="nav-item" data-page="production"><span class="nav-icon">◉</span>Egg production</button>
        <button class="nav-item" data-page="sales"><span class="nav-icon">↗</span>Egg sales</button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span>Feed & inventory</button>
        <button class="nav-item" data-page="health"><span class="nav-icon">♡</span>Health & care</button>
        <button class="nav-item" data-page="finance"><span class="nav-icon">＄</span>Expenses & profit</button>
        <button class="nav-item" data-page="investors"><span class="nav-icon">◉</span>Investors</button>
        <button class="nav-item" data-page="investor-roi"><span class="nav-icon">％</span>Investor ROI</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
        <button class="nav-item" data-page="team" id="team-nav" hidden><span class="nav-icon">♙</span>Team</button>
      </nav>
      <div class="side-bottom">
        <div class="farm-card"><div class="farm-overline">Your workspace</div><div class="farm-name">Lucea's Poultry Farm</div><div class="farm-location">Layer farm · Local workspace</div></div>
        <div class="profile"><div class="avatar">LP</div><div><div class="profile-name">Farm manager</div><div class="profile-role">Manager</div></div></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-left">
          <button class="icon-button menu-button" id="menu-button" aria-label="Open navigation">☰</button>
          <div class="mobile-brand">Fieldnote</div>
          <div class="breadcrumb">Farm management <span style="padding:0 7px;color:#c3c9c2">/</span><strong id="crumb">Overview</strong></div>
        </div>
        <div class="top-actions">
          <div class="date-pill"><span>◷</span><span id="today-label"></span></div>
          <span class="sync-status" id="sync-status">Local only</span>
          <button class="button secondary small" id="account-button" title="Cloud storage status">Local only</button>
          <button class="button secondary small" id="currency-button" title="Change farm currency">NGN</button>
          <button class="icon-button" id="alerts-button" aria-label="View inventory alerts">♧<span class="dot"></span></button>
        </div>
      </header>
      <section class="content" id="content" aria-live="polite"></section>
    </main>
  </div>
  <div id="overlay-root"></div>
  <script src="./supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "fieldnote-poultry-v1";
      const FARM_NAME = "Lucea's Poultry Farm";
      const supabaseSettings = window.FIELDNOTE_SUPABASE || {};
      const cloudConfigIncomplete = Boolean(supabaseSettings.url || supabaseSettings.anonKey) && !(supabaseSettings.url && supabaseSettings.anonKey);
      const cloudConfigured = Boolean(supabaseSettings.url && supabaseSettings.anonKey);
      let supabaseClient = null;
      let cloudInitError = "";
      if (cloudConfigured && window.supabase?.createClient) {
        try {
          supabaseClient = window.supabase.createClient(supabaseSettings.url, supabaseSettings.anonKey);
        } catch (error) {
          cloudInitError = error.message || "Invalid Supabase project settings.";
        }
      }
      let currentUser = null;
      let farmId = null;
      let memberRole = null;
      let isPrimaryManager = false;
      let requiresPasswordSetup = false;
      let teamMembers = [];
      let loadingUserId = null;
      let cloudSyncChain = Promise.resolve();
      let cloudStatus = cloudConfigured ? "Sign in required" : "Local only";
      const today = new Date();
      const dateISO = (date) => `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      const daysAgo = (days) => { const date = new Date(); date.setDate(date.getDate() - days); return dateISO(date); };
      const initialState = () => ({
        flocks: [],
        collections: [],
        sales: [],
        otherIncome: [],
        inventory: [],
        health: [],
        expenses: [],
        feedings: [],
        investors: [],
        investorRoiMonths: [],
        currency: "NGN",
        resetForFreshStart: true
      });
      let state;
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        state = !cloudConfigured && saved ? JSON.parse(saved) : initialState();
        if (saved && state.resetForFreshStart !== true) {
          if (!cloudConfigured) state = initialState();
          state.resetForFreshStart = true;
        }
        ["flocks","collections","sales","otherIncome","inventory","health","expenses","feedings","investors","investorRoiMonths"].forEach((key) => { if (!Array.isArray(state[key])) state[key] = []; });
        if (typeof state.currency !== "string" || state.currency === "USD") state.currency = "NGN";
      } catch (error) {
        console.error("Could not load saved farm data:", error);
        state = initialState();
      }
      let currentPage = "dashboard";
      let searchTerm = "";
      let selectedRoiMonth = "";
      const $ = (selector, root = document) => root.querySelector(selector);
      const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      const number = (value) => Number(value) || 0;
      const money = (value) => new Intl.NumberFormat(state.currency === "NGN" ? "en-NG" : undefined, { style: "currency", currency: state.currency || "NGN", minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(number(value));
      const num = (value) => new Intl.NumberFormat().format(number(value));
      const prettyDate = (date) => date ? new Date(date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }) : "—";
      const nameOf = (id) => state.flocks.find((flock) => flock.id === id)?.name || "Unassigned flock";
      const persist = () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
        catch (error) { console.error("Could not save farm data:", error); toast("Unable to save. Check browser storage."); }
        if (!supabaseClient || !currentUser || !farmId) return;
        const snapshot = JSON.parse(JSON.stringify(state));
        const targetFarmId = farmId;
        cloudStatus = "Syncing…";
        updateCloudControls();
        cloudSyncChain = cloudSyncChain.then(async () => {
          const { error } = await supabaseClient.from("farms")
            .update({ data: snapshot, updated_at: new Date().toISOString() })
            .eq("id", targetFarmId)
            .select("id")
            .single();
          if (error) throw error;
          cloudStatus = "Cloud synced";
          updateCloudControls();
        }).catch((error) => {
          console.error("Cloud sync failed:", error);
          cloudStatus = "Sync failed";
          updateCloudControls();
          toast(`Saved on this device, but cloud sync failed: ${error.message || "Check Supabase setup and connection."}`);
        });
      };
      const flockBirds = () => state.flocks.filter((f) => f.status !== "Culled").reduce((sum, f) => sum + number(f.birds), 0);
      const productionOn = (date) => state.collections.filter((c) => c.date === date).reduce((sum, c) => sum + number(c.trays), 0);
      const totalProduced = () => state.collections.reduce((sum, c) => sum + number(c.trays), 0);
      const soldTrays = () => state.sales.reduce((sum, s) => sum + number(s.trays), 0);
      const stockEggs = () => Math.max(0, totalProduced() - soldTrays());
      const flockEggStock = (flockId, grade) => Math.max(0,
        state.collections.filter((c) => c.flockId === flockId && c.grade === grade).reduce((sum, c) => sum + number(c.trays), 0) -
        state.sales.filter((s) => s.flockId === flockId && s.grade === grade).reduce((sum, s) => sum + number(s.trays), 0));
      const withdrawalEnd = (record) => {
        const end = new Date(`${record.date}T12:00:00`);
        end.setDate(end.getDate() + number(record.withdrawal));
        return dateISO(end);
      };
      const isWithdrawalActive = (record) => number(record.withdrawal) > 0 && withdrawalEnd(record) >= dateISO(today);
      const flockWithdrawal = (flockId) => state.health.find((record) => record.flockId === flockId && isWithdrawalActive(record));
      const salesRevenue = () => state.sales.reduce((sum, s) => sum + number(s.trays) * number(s.price), 0);
      const otherIncomeTotal = () => state.otherIncome.reduce((sum, item) => sum + number(item.amount), 0);
      const totalRevenue = () => salesRevenue() + otherIncomeTotal();
      const expenseTotal = () => state.expenses.reduce((sum, e) => sum + number(e.amount), 0);
      const paidRevenue = () => state.sales.filter((s) => s.paid).reduce((sum, s) => sum + number(s.trays) * number(s.price), 0);
      const activeFlocks = () => state.flocks.filter((f) => f.status !== "Culled");
      const flockAgeWeeks = (flock) => Math.max(0, number(flock.ageWeeksAtPurchase) + (new Date(`${dateISO(today)}T12:00:00`) - new Date(`${flock.purchased}T12:00:00`)) / 604800000);
      const rateFor = (flock) => {
        if (!number(flock.birds)) return 0;
        const rows = state.collections.filter((c) => c.flockId === flock.id && c.date >= daysAgo(6));
        const trays = rows.reduce((sum, c) => sum + number(c.trays), 0);
        const collectionDays = new Set(rows.map((c) => c.date)).size || 1;
        return Math.round((trays * 30 / collectionDays) / number(flock.birds) * 100);
      };
      const badge = (text, kind = "neutral") => `<span class="badge ${kind}"><span class="dot-status"></span>${esc(text)}</span>`;
      const heading = (eyebrow, title, subtitle, action) => `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div>${action || ""}</div>`;
      const metric = (label, value, icon, foot, iconColor = "") => `<article class="metric"><div class="metric-top"><span>${label}</span><span class="metric-icon" style="${iconColor}">${icon}</span></div><div class="metric-value">${value}</div><div class="metric-foot">${foot}</div></article>`;
      const empty = (message) => `<tr><td class="empty-state" colspan="8">${message}</td></tr>`;
      const iconForCategory = (category) => category === "Feed" ? "♧" : category === "Medicine" ? "♡" : category === "Packaging" ? "▤" : "◈";
      const remainingDays = (item) => item.category === "Feed" && number(item.quantity) ? Math.max(1, Math.floor(number(item.quantity) / (flockBirds() * .15 || 1))) : null;

      function chartSvg() {
        const labels = Array.from({ length: 7 }, (_, index) => daysAgo(6 - index));
        const values = labels.map((date) => productionOn(date));
        const max = Math.max(10, ...values) * 1.25;
        const left = 32, right = 475, top = 14, bottom = 145;
        const points = values.map((value, i) => ({ x: left + (right - left) * i / 6, y: bottom - (value / max) * (bottom - top) }));
        const line = points.map((p, i) => `${i ? "L" : "M"}${p.x},${p.y}`).join(" ");
        const area = `${line} L${right},${bottom} L${left},${bottom} Z`;
        const guides = [0, .5, 1].map((fraction) => {
          const y = bottom - fraction * (bottom - top);
          return `<line x1="${left}" y1="${y}" x2="${right}" y2="${y}" class="chart-grid"/><text x="0" y="${y + 3}" class="chart-label">${Math.round(max * fraction)}</text>`;
        }).join("");
        const dots = points.map((p) => `<circle cx="${p.x}" cy="${p.y}" r="3.5" class="chart-dot"/>`).join("");
        const dayLabels = labels.map((date, i) => `<text x="${points[i].x}" y="167" text-anchor="middle" class="chart-label">${new Date(date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" })}</text>`).join("");
        return `<svg class="chart" viewBox="0 0 490 180" role="img" aria-label="Egg production over the last seven days">${guides}<defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#95b380" stop-opacity=".28"/><stop offset="1" stop-color="#95b380" stop-opacity="0"/></linearGradient></defs><path d="${area}" class="chart-area"/><path d="${line}" class="chart-line"/>${dots}${dayLabels}</svg>`;
      }
      function renderDashboard() {
        const todayProduction = productionOn(dateISO(today));
        const weekProduction = state.collections.filter((c) => c.date >= daysAgo(6)).reduce((sum, c) => sum + number(c.trays), 0);
        const alerts = state.inventory.filter((item) => number(item.quantity) <= number(item.threshold));
        const active = activeFlocks();
        const flockRows = active.map((flock) => {
          const rate = rateFor(flock);
          return `<div class="flock-mini"><div class="flock-row"><div><div class="flock-mini-name">${esc(flock.name)}</div><div class="flock-mini-meta">${num(flock.birds)} birds · ${esc(flock.status)}</div></div><div class="flock-mini-rate">${rate}% <span style="font-weight:400;color:#879087">lay rate</span></div></div><div class="progress"><span style="width:${Math.min(100, rate)}%"></span></div></div>`;
        }).join("");
        const recent = [...state.sales].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 4);
        const salesRows = recent.length ? recent.map((sale) => `<tr><td class="strong-cell">${esc(sale.customer)}</td><td>${prettyDate(sale.date)}</td><td>${num(sale.trays)} trays</td><td class="strong-cell">${money(number(sale.trays) * number(sale.price))}</td><td>${badge(sale.paid ? "Paid" : "Unpaid", sale.paid ? "good" : "warn")}</td></tr>`).join("") : empty("No egg sales recorded yet.");
        const stockRows = state.inventory.slice(0, 4).map((item) => `<div class="stock-row"><div class="stock-icon">${iconForCategory(item.category)}</div><div class="stock-info"><div class="stock-name">${esc(item.name)}</div><div class="stock-unit">${esc(item.category)} · ${esc(item.unit)}</div></div><div class="stock-level">${num(item.quantity)}<small>${item.threshold ? `Reorder at ${num(item.threshold)}` : "in stock"}</small></div></div>`).join("");
        return `${heading(`${today.toLocaleDateString(undefined, { weekday: "long" })}, on the farm`, "Good morning, manager", "Here’s how your flock and egg business are doing today.", `<button class="button" data-action="log-production"><span>＋</span> Log today's eggs</button>`)}
          <div class="metrics">
            ${metric("Active layers", num(flockBirds()), "♧", `<span class="positive">${active.length} active flocks</span> · across your farm`)}
            ${metric("Eggs collected today", `${num(todayProduction)} <span style="font-size:13px;font-weight:550;letter-spacing:0">trays</span>`, "◉", `<span class="positive">${num(todayProduction * 30)} eggs</span> collected today`)}
            ${metric("Eggs ready to sell", `${num(stockEggs())} <span style="font-size:13px;font-weight:550;letter-spacing:0">trays</span>`, "▤", `${num(stockEggs() * 30)} eggs · ${money(paidRevenue())} cash received`)}
            ${metric("Egg sales · all time", money(salesRevenue()), "↗", `${money(expenseTotal())} recorded expenses · ${money(totalRevenue() - expenseTotal())} net incl. other income`)}
          </div>
          <div class="dashboard-grid">
            <section class="panel"><div class="panel-head"><div><div class="panel-title">Egg production</div><div class="panel-note">Collection by day · trays (30 eggs per tray)</div></div><button class="button secondary small" data-page-link="production">View log ↗</button></div><div class="chart-wrap">${chartSvg()}<div class="chart-footer"><span class="legend-dot"></span>Collected eggs <span style="margin-left:auto">${num(weekProduction)} trays this week</span></div></div></section>
            <section class="panel"><div class="panel-head"><div><div class="panel-title">Flock health</div><div class="panel-note">Current laying performance</div></div><button class="button secondary small" data-page-link="flocks">All flocks</button></div><div class="health-summary"><div class="health-total"><div><strong>${num(active.length)}</strong><span>active flocks</span></div><div class="big-icon">🐓</div></div>${flockRows || `<div class="empty-state">Add your first flock to get started.</div>`}</div></section>
          </div>
          <div class="bottom-grid">
            <section class="panel"><div class="panel-head"><div><div class="panel-title">Recent egg sales</div><div class="panel-note">Your latest customer orders and payments</div></div><button class="button secondary small" data-page-link="sales">All sales ↗</button></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Date</th><th>Quantity</th><th>Total</th><th>Payment</th></tr></thead><tbody>${salesRows}</tbody></table></div></section>
            <section class="panel"><div class="panel-head"><div><div class="panel-title">Stock at a glance</div><div class="panel-note">Feed, medicine and packaging</div></div><button class="button secondary small" data-page-link="inventory">Inventory</button></div><div class="stock-list">${stockRows || `<div class="empty-state">No stock items recorded.</div>`}</div>${alerts.length ? `<div class="alert-banner"><span class="alert-icon">⚠</span><div><strong>${alerts.length} stock item${alerts.length === 1 ? "" : "s"} need attention</strong><p>${esc(alerts.map((item) => item.name).join(", "))} ${alerts.length === 1 ? "is" : "are"} at or below reorder level.</p></div></div>` : ""}</section>
          </div>`;
      }
      function filterRows(rows, fields) {
        const query = searchTerm.trim().toLowerCase();
        return query ? rows.filter((row) => fields.some((field) => String(row[field] ?? "").toLowerCase().includes(query))) : rows;
      }
      function renderFlocks() {
        const rows = filterRows(state.flocks, ["name","breed","status"]);
        const laying = state.flocks.filter((f) => f.status === "Laying").length;
        const birds = flockBirds();
        const table = rows.length ? rows.map((f) => `<tr><td class="strong-cell">${esc(f.name)}<div class="muted-cell" style="font-size:9px;margin-top:4px">${esc(f.breed)}</div></td><td>${prettyDate(f.purchased)}</td><td>${f.ageWeeksAtPurchase === undefined ? "—" : `${Math.floor(flockAgeWeeks(f))} wk`}</td><td>${num(f.initialBirds)}</td><td class="strong-cell">${num(f.birds)} <span class="muted-cell" style="font-weight:400">alive</span></td><td>${num(Math.max(0, number(f.initialBirds) - number(f.birds)))}</td><td>${rateFor(f)}%</td><td>${badge(f.status, f.status === "Laying" ? "good" : f.status === "Growing" ? "warn" : "neutral")}</td><td><button class="button secondary small" data-action="edit-flock" data-id="${esc(f.id)}">Edit</button></td></tr>`).join("") : empty(searchTerm ? "No flocks match your search." : "No flocks yet. Add your first flock to begin tracking.");
        return `${heading("Your birds", "Flock management", "Track each batch from purchase through laying, replacement and end of lay.", `<button class="button" data-action="add-flock"><span>＋</span> Add a flock</button>`)}
          <div class="metrics">${metric("Birds on farm", num(birds), "♧", `${state.flocks.length} flocks recorded`)}${metric("Laying flocks", num(laying), "◉", "Currently producing eggs")}${metric("Eggs collected", `${num(totalProduced())} trays`, "▤", `${num(stockEggs())} trays still available`)}${metric("Birds lost", num(state.flocks.reduce((s,f) => s + Math.max(0, number(f.initialBirds) - number(f.birds)), 0)), "♡", "Based on initial flock count")}</div>
          <section class="panel list-panel"><div class="panel-head"><div><div class="panel-title">All flocks</div><div class="panel-note">Purchase value, age, bird count and stage are kept for each batch</div></div><input class="search" data-search placeholder="Search flock or breed…" value="${esc(searchTerm)}"></div><div class="list-summary"><span class="summary-chip"><strong>${state.flocks.length}</strong>total flocks</span><span class="summary-chip"><strong>${num(birds)}</strong>active birds</span><span class="summary-chip"><strong>${laying}</strong>currently laying</span></div><div class="table-wrap"><table><thead><tr><th>Flock / breed</th><th>Purchased</th><th>Age</th><th>Started with</th><th>Current count</th><th>Losses</th><th>Lay rate</th><th>Status</th><th></th></tr></thead><tbody>${table}</tbody></table></div></section>`;
      }
      function renderProduction() {
        const rows = filterRows([...state.collections].sort((a,b) => b.date.localeCompare(a.date)), ["date","grade"]);
        const todayTotal = productionOn(dateISO(today));
        const rejected = state.collections.reduce((sum,c) => sum + number(c.rejected), 0);
        const body = rows.length ? rows.map((c) => `<tr><td>${prettyDate(c.date)}</td><td class="strong-cell">${esc(nameOf(c.flockId))}</td><td>${esc(c.grade)}</td><td class="strong-cell">${num(c.trays)} trays</td><td>${num(number(c.trays) * 30)} eggs</td><td>${num(c.rejected)}</td></tr>`).join("") : empty("No egg collections found.");
        return `${heading("The daily rhythm", "Egg production", "Log collections by flock and grade. One tray holds 30 eggs.", `<button class="button" data-action="log-production"><span>＋</span> Log collection</button>`)}
          <div class="metrics">${metric("Today's collection", `${num(todayTotal)} trays`, "◉", `${num(todayTotal * 30)} eggs`)}${metric("Total collected", `${num(totalProduced())} trays`, "▤", "Across all recorded collections")}${metric("Available to sell", `${num(stockEggs())} trays`, "↗", "Collections less recorded sales")}${metric("Rejected / cracked", num(rejected), "⚠", "Eggs set aside from sale")}</div>
          <section class="panel list-panel"><div class="panel-head"><div><div class="panel-title">Collection log</div><div class="panel-note">Daily egg collection records by flock</div></div><input class="search" data-search placeholder="Search grade or date…" value="${esc(searchTerm)}"></div><div class="list-summary"><span class="summary-chip"><strong>${num(todayTotal)}</strong>trays today</span><span class="summary-chip"><strong>${num(stockEggs())}</strong>trays available</span><span class="summary-chip"><strong>30</strong>eggs per tray</span></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Flock</th><th>Grade</th><th>Collected</th><th>Egg count</th><th>Rejected</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
      }
      function renderSales() {
        const rows = filterRows([...state.sales].sort((a,b) => b.date.localeCompare(a.date)), ["customer","date","grade"]);
        const unpaid = state.sales.filter((s) => !s.paid).reduce((sum,s) => sum + number(s.trays) * number(s.price), 0);
        const body = rows.length ? rows.map((s) => `<tr><td class="strong-cell">${esc(s.customer)}</td><td>${prettyDate(s.date)}</td><td>${esc(nameOf(s.flockId))}</td><td>${esc(s.grade)}</td><td>${num(s.trays)} trays</td><td>${money(s.price)} / tray</td><td class="strong-cell">${money(number(s.trays) * number(s.price))}</td><td>${badge(s.paid ? "Paid" : "Unpaid", s.paid ? "good" : "warn")}</td><td>${s.paid ? "" : `<button class="button secondary small" data-action="mark-paid" data-id="${esc(s.id)}">Mark paid</button>`}</td></tr>`).join("") : empty("No sales found. Record your first egg sale.");
        return `${heading("From farm to customer", "Egg sales", "Record buyers, quantities, prices and payment status. Sales reduce eggs available for sale.", `<button class="button" data-action="add-sale"><span>＋</span> Record a sale</button>`)}
          <div class="metrics">${metric("Sales revenue", money(salesRevenue()), "↗", "Value of all recorded sales")}${metric("Cash received", money(paidRevenue()), "＄", "Sales marked as paid")}${metric("Awaiting payment", money(unpaid), "◷", `${state.sales.filter((s) => !s.paid).length} unpaid orders`)}${metric("Trays sold", num(soldTrays()), "▤", `${num(stockEggs())} trays remaining` )}</div>
          <section class="panel list-panel"><div class="panel-head"><div><div class="panel-title">Sales ledger</div><div class="panel-note">Customer orders and outstanding balances</div></div><input class="search" data-search placeholder="Search customer…" value="${esc(searchTerm)}"></div><div class="list-summary"><span class="summary-chip"><strong>${state.sales.length}</strong>orders</span><span class="summary-chip"><strong>${money(unpaid)}</strong>outstanding</span><span class="summary-chip"><strong>${num(stockEggs())}</strong>trays in stock</span></div><div class="table-wrap"><table><thead><tr><th>Customer</th><th>Date</th><th>Flock</th><th>Grade</th><th>Quantity</th><th>Price</th><th>Total</th><th>Payment</th><th></th></tr></thead><tbody>${body}</tbody></table></div></section>`;
      }
      function renderInventory() {

        }).join("") || empty("No feed issues recorded yet.");
        return `${heading("Keep essentials on hand", "Feed & inventory", "Track feed, medicines and packaging, manage reorder levels and log daily feed use.", `<div class="toolbar"><button class="button secondary" data-action="log-feed">↓ Issue feed</button><button class="button" data-action="add-stock"><span>＋</span> Add stock</button></div>`)}
          <div class="metrics">${metric("Stock items", num(state.inventory.length), "▤", "Feed, medicine & packaging")}${metric("Low-stock items", num(low.length), "⚠", low.length ? "Below reorder threshold" : "All stock above reorder level")}${metric("Feed on hand", `${num(state.inventory.filter((i) => i.category === "Feed").reduce((s,i) => s + number(i.quantity),0))} kg`, "♧", "Across all feed types")}${metric("Feed issued", `${num(state.feedings.reduce((s,f) => s + number(f.quantity),0))} kg`, "↓", "Total recorded usage")}</div>
          <section class="panel list-panel"><div class="panel-head"><div><div class="panel-title">Stock register</div><div class="panel-note">A low-stock alert appears when quantity reaches the reorder level</div></div><input class="search" data-search placeholder="Search inventory…" value="${esc(searchTerm)}"></div><div class="list-summary">${low.length ? `<span class="summary-chip"><strong>${low.length}</strong>need reordering</span>` : `<span class="summary-chip"><strong>All good</strong>stock levels healthy</span>`}<span class="summary-chip"><strong>${state.feedings.length}</strong>feed issues logged</span></div><div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>On hand</th><th>Reorder at</th><th>Unit cost</th><th>Feed cover / expiry</th><th>Status</th><th></th></tr></thead><tbody>${body}</tbody></table></div></section>
          <section class="panel list-panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Feed issue log</div><div class="panel-note">Feed quantity issued to each flock over time</div></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Flock</th><th>Feed</th><th>Quantity</th></tr></thead><tbody>${feedRows}</tbody></table></div></section>`;

      function renderHealth() {

      const managementFeeRate = 0.3;
      function renderInvestorRoi() {
        const months = [...state.investorRoiMonths].sort((a, b) => b.month.localeCompare(a.month));
        const selected = months.find((record) => record.month === selectedRoiMonth) || months[0] || null;
        if (selected) selectedRoiMonth = selected.month;
        const sales = number(selected?.sales);
        const capital = number(selected?.capital);
        const fee = sales * managementFeeRate;
        const distributable = sales - fee;
        const payouts = selected ? state.investors.map((investor) => {
          const contribution = selected.investorAmounts && Object.prototype.hasOwnProperty.call(selected.investorAmounts, investor.id)
            ? number(selected.investorAmounts[investor.id])
            : number(investor.amount);
          const ownership = capital > 0 ? contribution / capital * 100 : 0;
          return { investor, contribution, ownership, payout: distributable * ownership / 100 };
        }) : [];
        const payoutRows = payouts.length ? payouts.map(({ investor, contribution, ownership, payout }) =>
          `<tr><td class="strong-cell">${esc(investor.name)}</td><td>${money(contribution)}</td><td>${ownership.toFixed(2)}%</td><td class="strong-cell">${money(payout)}</td></tr>`
        ).join("") : `<tr><td class="empty-state" colspan="4">${state.investors.length ? "Select or record a month to calculate investor distributions." : "Add investors in the Investors section to calculate individual distributions."}</td></tr>`;

        }).join("") : `<tr><td class="empty-state" colspan="6">No monthly sales recorded yet. Record a month to calculate investor distributions.</td></tr>`;

        return `${heading("Monthly investor distributions", "Investor ROI", "Enter each month’s total company capital and sales to calculate investor ownership and distributions.", action)}

          <div class="alert-banner" style="margin-bottom:16px"><span class="alert-icon">ⓘ</span><div><strong>How the calculation works</strong><p>Ownership = investor contribution ÷ that month’s company capital. The management fee is 30% of monthly sales; each payout = (monthly sales − management fee) × ownership. Capital, sales and investor contributions are saved as monthly snapshots.</p></div></div>
          <section class="panel list-panel"><div class="panel-head"><div><div class="panel-title">Investor distributions${selected ? ` · ${esc(new Date(`${selected.month}-15T12:00:00`).toLocaleDateString(undefined, { month: "long", year: "numeric" }))}` : ""}</div><div class="panel-note">Ownership is calculated against the selected month’s total company capital.</div></div></div><div class="list-summary"><span class="summary-chip"><strong>${money(capital)}</strong>company capital</span><span class="summary-chip"><strong>${money(fee)}</strong>management fee</span><span class="summary-chip"><strong>${money(distributable)}</strong>distribution pool</span></div><div class="table-wrap"><table><thead><tr><th>Investor</th><th>Contribution</th><th>Ownership</th><th>Monthly payout</th></tr></thead><tbody>${payoutRows}</tbody></table></div></section>
          <section class="panel list-panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Monthly records</div><div class="panel-note">Saved monthly capital, sales and investor contribution figures with the corresponding fee and distribution pool.</div></div></div><div class="table-wrap"><table><thead><tr><th>Month</th><th>Company capital</th><th>Total sales</th><th>Management fee</th><th>Distribution pool</th><th></th></tr></thead><tbody>${historyRows}</tbody></table></div></section>`;
      }

          <div class="report-columns"><section class="panel"><div class="panel-head"><div><div class="panel-title">Costs by category</div><div class="panel-note">Based on all expenses entered</div></div></div><div style="padding:0 20px 14px">${expenseRows}<div class="report-row" style="border-top:1px solid #dfe5dc"><strong>Total expenses</strong><strong>${money(expenseTotal())}</strong></div></div></section>
          <section class="panel"><div class="panel-head"><div><div class="panel-title">Profit snapshot</div><div class="panel-note">Simple management view · not an accounting statement</div></div></div><div style="padding:0 20px 14px"><div class="report-row"><span>Egg sales</span><strong>${money(salesRevenue())}</strong></div><div class="report-row"><span>Other farm income</span><strong>${money(otherIncomeTotal())}</strong></div><div class="report-row"><span>Recorded expenses</span><strong>− ${money(expenseTotal())}</strong></div><div class="report-row" style="border-top:1px solid #dfe5dc"><strong>Net recorded</strong><strong>${money(net)}</strong></div><div class="report-row"><span>Cash received</span><strong>${money(paidFarmIncome)}</strong></div><div class="report-row"><span>Still unpaid</span><strong>${money(unpaidRevenue)}</strong></div><div class="alert-banner" style="margin:12px 0 0"><span class="alert-icon">ⓘ</span><div><strong>Include all costs for a useful estimate</strong><p>Bird purchases, feed, labor, transport, utilities and other costs only count after you record them. Stock purchases are expensed when added; feed issuance only tracks usage.</p></div></div></div></section></div>
          <section class="panel list-panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Other farm income</div><div class="panel-note">Record spent-hen and manure sales separately from egg revenue</div></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Assigned to</th><th>Amount</th><th>Payment</th><th></th></tr></thead><tbody>${incomeBody}</tbody></table></div></section>
          <section class="panel list-panel" style="margin-top:16px"><div class="panel-head"><div><div class="panel-title">Expense ledger</div><div class="panel-note">Costs can be assigned to a flock or kept farm-wide</div></div></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Assigned to</th><th>Amount</th></tr></thead><tbody>${body}</tbody></table></div></section>`;
      }

          <div class="report-grid">${metric("Average production", `${average.toFixed(1)} trays`, "◉", `${collectionDays} collection days recorded`)}${metric("Lay rate · active birds", `${birds ? Math.round(totalProduced() * 30 / Math.max(collectionDays,1) / birds * 100) : 0}%`, "♧", "Estimated from recorded collections")}${metric("Feed costs entered", money(feedCost), "▤", "Expenses categorized as feed")}</div>

          <section class="panel"><div class="panel-head"><div><div class="panel-title">Business snapshot</div><div class="panel-note">Cumulative totals from recorded activity</div></div></div><div style="padding:0 20px 14px"><div class="report-row"><span>Eggs collected</span><strong>${num(totalProduced())} trays</strong></div><div class="report-row"><span>Eggs sold</span><strong>${num(soldTrays())} trays</strong></div><div class="report-row"><span>Available for sale</span><strong>${num(stockEggs())} trays</strong></div><div class="report-row"><span>Egg sales revenue</span><strong>${money(salesRevenue())}</strong></div><div class="report-row"><span>Other farm income</span><strong>${money(otherIncomeTotal())}</strong></div><div class="report-row"><span>Expenses entered</span><strong>${money(expenseTotal())}</strong></div></div></section></div>

      const pageInfo = { dashboard: ["Overview","Farm overview"], flocks: ["Flocks","Flock management"], production: ["Egg production","Daily egg collection"], sales: ["Egg sales","Sales ledger"], inventory: ["Feed & inventory","Stock management"], health: ["Health & care","Health register"], finance: ["Expenses & profit","Farm finances"], investors: ["Investors","Company ownership"], "investor-roi": ["Investor ROI","Monthly investor distributions"], reports: ["Reports","Farm reports"], team: ["Team","Farm team"] };

        ], "Send invitation", async (values) => {

      function showAuthGate(message = "") {
        $("#overlay-root").innerHTML = `<div class="auth-screen"><section class="auth-card" role="dialog" aria-modal="true" aria-labelledby="auth-title"><div class="auth-brand"><span class="brand-mark">♧</span><strong>Fieldnote · Lucea's Poultry Farm</strong></div><div class="auth-kicker">Secure manager access</div><h2 id="auth-title">Welcome back</h2><p>Sign in with the email and password provided by your farm's primary manager.</p><form class="auth-form" id="auth-form">${field("email","Email","email",{placeholder:"you@example.com"})}${field("password","Password","password",{placeholder:"Enter your password"})}<div class="auth-error" role="alert">${esc(message)}</div><button class="button" type="submit">Sign in</button></form></section></div>`;
        $("#auth-form").addEventListener("submit", async (event) => {
          event.preventDefault();
          const form = event.currentTarget;
          if (!form.reportValidity()) return;
          const button = $("button[type='submit']", form);
          const errorBox = $(".auth-error", form);
          button.disabled = true;
          button.textContent = "Signing in…";
          errorBox.textContent = "";
          const values = Object.fromEntries(new FormData(form).entries());
          try {
            if (!supabaseClient) throw new Error(cloudInitError || "Supabase is not configured or its client library failed to load. Follow the setup instructions in README.md.");
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email: values.email, password: values.password });
            if (error) throw error;
            await loadCloudFarm(data.user);
          } catch (error) {
            console.error("Supabase authentication failed:", error);
            errorBox.textContent = error.message || "Authentication failed. Check your connection and try again.";
            button.disabled = false;
            button.textContent = "Sign in";
          }
        });
        updateCloudControls();

      function field(name, label, type = "text", options = {}) {
        const required = options.required === false ? "" : "required";
        const full = options.full ? " full" : "";
        let control;
        if (type === "select") {
          const optionHtml = (options.options || []).map((o) => `<option value="${esc(o.value)}" ${String(options.value ?? "") === String(o.value) ? "selected" : ""}>${esc(o.label)}</option>`).join("");
          control = `<select name="${esc(name)}" ${required}>${optionHtml}</select>`;
        } else if (type === "textarea") {
          control = `<textarea name="${esc(name)}" placeholder="${esc(options.placeholder || "")}" ${required}>${esc(options.value || "")}</textarea>`;
        } else {
          control = `<input name="${esc(name)}" type="${type}" value="${esc(options.value ?? "")}" placeholder="${esc(options.placeholder || "")}" ${options.min !== undefined ? `min="${options.min}"` : ""} ${options.step ? `step="${options.step}"` : ""} ${required}>`;
        }
        return `<div class="field${full}"><label>${label}${required ? " *" : ""}</label>${control}</div>`;

            capital,
            sales:number(values.sales),
            investorAmounts:existingIndex >= 0 && state.investorRoiMonths[existingIndex].investorAmounts
              ? state.investorRoiMonths[existingIndex].investorAmounts
              : Object.fromEntries(state.investors.map((investor) => [investor.id, number(investor.amount)]))
          };
          if (existingIndex >= 0) state.investorRoiMonths[existingIndex] = record;
          else state.investorRoiMonths.push(record);
          selectedRoiMonth = targetMonth;
          toast(`ROI figures saved for ${new Date(`${targetMonth}-15T12:00:00`).toLocaleDateString(undefined, { month:"long", year:"numeric" })}.`);
          return "";
        });
      }
      function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url; link.download = `fieldnote-farm-${dateISO(today)}.json`; link.click();
        URL.revokeObjectURL(url);
        toast("Farm data exported.");
      }
      function changeCurrency() {
        const currencies = ["USD","GHS","NGN","KES","UGX","ZAR","GBP","EUR","CAD","AUD"];
        openModal("Farm currency", "Choose the currency used for prices, sales, expenses and investor contributions.", [
          field("currency","Display currency","select",{value:state.currency,options:currencies.map((currency) => ({value:currency,label:currency}))})
        ],"Save currency",(v) => {
          state.currency = v.currency;
          $("#currency-button").textContent = v.currency;
          toast(`Currency updated to ${v.currency}.`);
          return "";
        });
      }
      document.addEventListener("click", (event) => {
        const nav = event.target.closest("[data-page]");
        if (nav) {
          if (nav.dataset.page === "team" && !isPrimaryManager) return;
          currentPage = nav.dataset.page;
          searchTerm = "";
          $("#sidebar").classList.remove("open");
          render();
          return;
        }
        const link = event.target.closest("[data-page-link]");
        if (link) { currentPage = link.dataset.pageLink; searchTerm = ""; render(); return; }
        const button = event.target.closest("[data-action]");
        if (!button) return;
        const action = button.dataset.action;
        if (action === "invite-member") inviteTeamMember();
        else if (action === "log-production") addCollection();
        else if (action === "add-flock") flockForm();
        else if (action === "edit-flock") flockForm(state.flocks.find((f) => f.id === button.dataset.id));
        else if (action === "add-sale") addSale();
        else if (action === "add-stock") addStock();
        else if (action === "restock") addStock(state.inventory.find((i) => i.id === button.dataset.id));
        else if (action === "log-feed") logFeed();
        else if (action === "add-health") addHealth();
        else if (action === "add-expense") addExpense();
        else if (action === "add-income") addIncome();
        else if (action === "add-investor") investorForm();
        else if (action === "edit-investor") investorForm(state.investors.find((investor) => investor.id === button.dataset.id));
        else if (action === "edit-roi-month") investorRoiMonthForm(button.dataset.month);
        else if (action === "select-roi-month") { selectedRoiMonth = button.dataset.month; render(); }
        else if (action === "export-data") exportData();
        else if (action === "mark-paid") {
          const sale = state.sales.find((s) => s.id === button.dataset.id);
          if (sale) { sale.paid = true; persist(); render(); toast("Payment marked as received."); }
        }
        else if (action === "mark-income-paid") {
          const income = state.otherIncome.find((i) => i.id === button.dataset.id);
          if (income) { income.paid = true; persist(); render(); toast("Income marked as received."); }
        }
      });
      document.addEventListener("input", (event) => {
        if (event.target.matches("[data-search]")) {
          const input = event.target;
          const start = input.selectionStart;
          searchTerm = input.value;
          render();
          const updated = $("[data-search]");
          if (updated) { updated.focus(); updated.setSelectionRange(start, start); }
        }
      });
      $("#menu-button").addEventListener("click", () => $("#sidebar").classList.toggle("open"));
      $("#alerts-button").addEventListener("click", () => { currentPage = "inventory"; searchTerm = ""; render(); $("#content").scrollIntoView({behavior:"smooth"}); });
      $("#currency-button").addEventListener("click", changeCurrency);
      $("#account-button").addEventListener("click", accountAction);
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (!$(".auth-screen")) $("#overlay-root").innerHTML = "";
          $("#sidebar").classList.remove("open");
        }
      });
      render();
      $("#currency-button").textContent = state.currency;
      updateCloudControls();
      if (cloudConfigured) {
        cloudStatus = "Checking session…";
        showAuthGate("Checking your Supabase session…");
        startCloudSession();
      }
      else persist();
    })();
  </script>
</body>
</html>
